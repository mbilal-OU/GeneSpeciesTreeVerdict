name: Bug report
description: Report a reproducible software failure or unexpected behavior
title: "[Bug]: "
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      render: shell
    validations:
      required: true
  - type: textarea
    id: minimal
    attributes:
      label: Minimal reproducible example
      description: Provide minimal trees/mapping if they can be shared.
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
